services:
  pocketmap:
    image: ghcr.io/pocketmap/pocketmap:main
    # To build locally instead, uncomment the following:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./tiles:/app/tiles
      - ./pb_data:/app/pb_data
    restart: unless-stopped